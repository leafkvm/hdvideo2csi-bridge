<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- hd2csi built with the `dbus` feature: /usr/share/dbus-1/system.d/ -->
<busconfig>
  <!-- the daemon and the server run as root -->
  <policy user="root">
    <allow own="org.leafkvm.Bridge"/>
    <allow send_destination="org.leafkvm.Bridge"/>
  </policy>
  <!-- everyone else may read the reports -->
  <policy context="default">
    <allow send_destination="org.leafkvm.Bridge"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.leafkvm.Bridge"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.leafkvm.Bridge"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
